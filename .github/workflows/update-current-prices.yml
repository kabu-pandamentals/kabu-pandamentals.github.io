name: Update current stock prices

on:
  schedule:
    # 東証前場 9:00-11:30 JST = 00:00-02:30 UTC、平日のみ
    - cron: '0,15,30,45 0-2 * * 1-5'
    # 東証後場 12:30-15:30 JST = 03:30-06:30 UTC、平日のみ
    - cron: '0,15,30,45 3-6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-current-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch current prices from kabutan.jp
        run: node scripts/update-current-prices.js

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/current-prices.js; then
            echo "No price changes, skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/current-prices.js
          git commit -m "Update current stock prices"
          git push
